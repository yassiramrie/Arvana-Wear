name: Deploy Advanced — Arvana Wear

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Syntax check (server.js)
        run: |
          echo "=== TEST 1: Checking server.js syntax ==="
          if node --check server.js; then
            echo "PASS — server.js has no syntax errors"
          else
            echo "FAIL — server.js has a syntax error. Run 'node --check server.js' locally."
            exit 1
          fi

      # TEST 2: Verify package.json is valid JSON
      - name: Validate package.json
        run: |
          echo "=== TEST 2: Validating package.json ==="
          if node -e "require('./package.json'); console.log('PASS — package.json is valid JSON')"; then
            :
          else
            echo "FAIL — package.json is not valid JSON."
            exit 1
          fi

      - name: Security audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to EC2 (Docker Compose)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "server.js,package.json,package-lock.json,init.sql,index.html,Dockerfile,.dockerignore,docker-compose.yml,nginx,monitoring"
          target:   "~/arvana-wear"

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     DB_PASSWORD,GRAFANA_PASSWORD
          script: |
            set -e

            # --- Install Docker Engine (jika belum ada) ---
            if ! command -v docker &>/dev/null; then
              echo "=== Docker not found, installing... ==="
              curl -fsSL https://get.docker.com | sudo sh
              echo "Docker installed: $(sudo docker --version)"
            else
              echo "Docker already installed: $(sudo docker --version)"
            fi

            # --- Pastikan Docker Compose plugin tersedia ---
            if ! sudo docker compose version &>/dev/null 2>&1; then
              echo "=== Installing Docker Compose plugin ==="
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            echo "Docker Compose: $(sudo docker compose version)"

            cd ~/arvana-wear

            # Setup environment variables untuk Docker Compose
            printf "DB_PASSWORD=%s\nGRAFANA_PASSWORD=%s\n" \
              "${DB_PASSWORD}" "${GRAFANA_PASSWORD}" > .env
            chmod 600 .env

            # Hapus paksa container lama jika nyangkut
            sudo docker rm -f arvana-app || true

            # Bersihkan cache build dan container/image yang tidak terpakai agar disk tidak penuh
            sudo docker system prune -f
            sudo docker builder prune -af

            sudo docker compose up -d --build
            sudo docker compose ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Menunggu services menyala (termasuk healthcheck Postgres)..."
            for i in {1..6}; do
              sleep 10
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8888/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "PASS — App is live at port 8888!"
                exit 0
              fi
              echo "Percobaan $i gagal (HTTP $STATUS). Retrying..."
            done
            
            echo "FAIL — App tidak merespons setelah 60 detik."
            cd ~/arvana-wear && sudo docker compose logs --tail=30 app nginx
            exit 1

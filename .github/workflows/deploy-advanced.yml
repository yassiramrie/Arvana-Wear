        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GF_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:

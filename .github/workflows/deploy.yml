name: CI — Arvana Wear

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and scan images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      API_REPOSITORY: arvana-wear-dev-api
      FRONTEND_REPOSITORY: arvana-wear-dev-frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate source
        run: |
          node --check server.js
          node --check telemetry.js
          node --check scripts/migrate.js
          node -e "require('./package.json')"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap-state init -backend=false -input=false
          terraform -chdir=infra/bootstrap-state validate
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Validate Kubernetes manifests
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Render Kubernetes manifests
        run: kubectl kustomize gitops/apps/arvana/dev > /dev/null

      - name: Build API image
        run: docker build --tag arvana-api:${IMAGE_TAG} --file Dockerfile .

      - name: Build frontend image
        run: docker build --tag arvana-frontend:${IMAGE_TAG} --file nginx/Dockerfile .

      - name: Scan API image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          arvana-api:${IMAGE_TAG}

      - name: Scan frontend image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          arvana-frontend:${IMAGE_TAG}

  dast:
    name: DAST with OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create temporary test credentials
        run: |
          {
            printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'GRAFANA_PASSWORD=%s\n' "$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
          echo 'NODE_ENV=development' >> "$GITHUB_ENV"
          echo 'CORS_ORIGIN=http://localhost' >> "$GITHUB_ENV"
          echo 'DB_SSL=false' >> "$GITHUB_ENV"

      - name: Start temporary API and frontend
        run: docker compose up -d --build postgres app nginx

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Scan temporary application with OWASP ZAP
        run: >-
          docker run --rm --network host
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py -t http://127.0.0.1 -I

      - name: Stop temporary application
        if: always()
        run: docker compose down --volumes

  publish-and-propose:
    name: Publish images and propose GitOps update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, dast]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-3' }}
      API_REPOSITORY: arvana-wear-dev-api
      FRONTEND_REPOSITORY: arvana-wear-dev-frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag arvana-api:${IMAGE_TAG} --file Dockerfile .

      - name: Build frontend image
        run: docker build --tag arvana-frontend:${IMAGE_TAG} --file nginx/Dockerfile .

      - name: Scan API image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          arvana-api:${IMAGE_TAG}

      - name: Scan frontend image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          arvana-frontend:${IMAGE_TAG}

      - name: Verify AWS publishing configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set the AWS_ROLE_ARN Actions variable to the Terraform github_actions_role_arn output."
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish scanned images to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "arvana-api:${IMAGE_TAG}" "${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"
          docker tag "arvana-frontend:${IMAGE_TAG}" "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${IMAGE_TAG}"

      - name: Propose GitOps image update
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("gitops/apps/arvana/dev/kustomization.yaml")
          contents = manifest.read_text()
          images = {
              "arvana-wear-api": f"{os.environ['ECR_REGISTRY']}/{os.environ['API_REPOSITORY']}",
              "arvana-wear-frontend": f"{os.environ['ECR_REGISTRY']}/{os.environ['FRONTEND_REPOSITORY']}",
          }
          for image, repository in images.items():
              pattern = rf"(?m)(  - name: {re.escape(image)}\n    newName: )\S+(\n    newTag: )\S+"
              updated, count = re.subn(
                  pattern,
                  lambda match: f"{match.group(1)}{repository}{match.group(2)}{os.environ['IMAGE_TAG']}",
                  contents,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected image entry not found: {image}")
              contents = updated
          manifest.write_text(contents)
          PY

      - name: Validate proposed GitOps update
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Render proposed GitOps manifests
        run: |
          kubectl kustomize gitops/applications > /dev/null
          kubectl kustomize gitops/bootstrap > /dev/null
          kubectl kustomize gitops/apps/arvana/dev > /dev/null

      - name: Create GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(gitops): deploy ${{ github.sha }}"
          branch: automation/deploy-${{ github.sha }}
          delete-branch: true
          title: "Deploy Arvana Wear ${{ github.sha }}"
          body: |
            Update the development deployment to the immutable image tags built and scanned by CI.

            - API: `${{ github.sha }}`
            - Frontend: `${{ github.sha }}`
          add-paths: gitops/apps/arvana/dev/kustomization.yaml

# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline — Arvana Wear (Busana Muslim)
# Trigger: setiap push ke branch 'main'
#
# Alur:
#   test → deploy
#
# GitHub Secrets yang harus diset di repo Settings → Secrets:
#   EC2_HOST               → IP publik atau domain EC2
#   EC2_USER               → SSH username (biasanya: ubuntu)
#   EC2_SSH_KEY            → Isi file .pem (private key)
#   DB_PASSWORD            → Password PostgreSQL container
#   GRAFANA_PASSWORD       → Password login Grafana (port 3001)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy — Arvana Wear

on:
  push:
    branches: [main]

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: TEST
  # Jalan di GitHub runner (cloud) — tidak butuh server kita.
  # Kalau ada step yang gagal, pipeline berhenti dan job 'deploy' tidak jalan.
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Cek syntax JS — kalau ada typo/bracket kurang, langsung gagal di sini
      - name: Syntax check (server.js)
        run: node --check server.js

      # Validasi package.json adalah JSON yang valid
      - name: Validate package.json
        run: node -e "require('./package.json')"

      # Scan dependency untuk vulnerability HIGH/CRITICAL
      - name: Security audit
        run: npm audit --audit-level=high

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: DEPLOY
  # Jalan setelah job 'test' berhasil (needs: test).
  # Kirim file ke EC2, lalu jalankan semua container via Docker Compose.
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EC2 (Docker Compose)
    runs-on: ubuntu-latest
    needs: test   # ← Tunggu job 'test' selesai dulu

    steps:
      - uses: actions/checkout@v4

      # ── STEP 1: Kirim semua file ke EC2 via SCP ──────────────────────────────
      # appleboy/scp-action = seperti perintah 'scp' tapi dalam bentuk action.
      # Semua file ini dibutuhkan Docker untuk build & run container.
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          target:   "~/arvana-wear"
          source:   "server.js,package.json,package-lock.json,init.sql,index.html,Dockerfile,.dockerignore,docker-compose.yml,nginx,monitoring"

      # ── STEP 2: SSH ke EC2 → Install Docker → Deploy ─────────────────────────
      # 'env' + 'envs' = cara aman untuk kirim secret ke dalam shell script SSH.
      # Secret TIDAK boleh ditulis langsung di 'script' karena akan ter-log.
      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     DB_PASSWORD,GRAFANA_PASSWORD   # ← kirim env vars di atas ke dalam shell
          script: |
            set -e

            # Install Docker jika belum ada di EC2
            if ! command -v docker &>/dev/null; then
              echo "=== Docker not found, installing... ==="
              # Wait for any background apt-get processes (like unattended-upgrades) to finish
              while sudo pgrep -x apt-get >/dev/null || sudo pgrep -x apt >/dev/null || sudo pgrep -x dpkg >/dev/null || sudo pgrep -f unattended-upgrades >/dev/null; do
                echo "Waiting for background apt/dpkg processes to finish..."
                sleep 10
              done
              curl -fsSL https://get.docker.com | sudo sh
            fi

            # Pastikan Docker Compose plugin tersedia
            if ! sudo docker compose version &>/dev/null 2>&1; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            cd ~/arvana-wear

            # Buat file .env dari secrets CI — TIDAK pernah di-commit ke git!
            # docker-compose.yml membaca ${DB_PASSWORD} dan ${GRAFANA_PASSWORD} dari file ini.
            printf "DB_PASSWORD=%s\nGRAFANA_PASSWORD=%s\n" \
              "${DB_PASSWORD}" "${GRAFANA_PASSWORD}" > .env
            chmod 600 .env
            
            # Matikan dan bersihkan container lama dengan aman menggunakan Compose
            sudo docker compose down || true

            # Bersihkan cache build dan container/image yang tidak terpakai agar disk tidak penuh
            sudo docker system prune -f
            sudo docker builder prune -af

            # Jalankan semua 6 container (build app image dulu, pull sisanya)
            sudo docker compose up -d --build

            # Tampilkan status semua container
            sudo docker compose ps

      # ── STEP 3: Health check ─────────────────────────────────────────────────
      # Pastikan app merespons setelah deploy. Kalau gagal, pipeline merah
      # dan kita bisa lihat log container untuk debug.
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Menunggu services menyala (termasuk healthcheck Postgres)..."
            for i in {1..6}; do
              sleep 10
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8888/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "PASS — App is live at port 8888!"
                exit 0
              fi
              echo "Percobaan $i gagal (HTTP $STATUS). Retrying..."
            done
            
            echo "FAIL — App tidak merespons setelah 60 detik."
            cd ~/arvana-wear && sudo docker compose logs --tail=30 app nginx
            exit 1

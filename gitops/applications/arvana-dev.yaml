apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arvana-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yassiramrie/Arvana-Wear.git
    targetRevision: main
    path: gitops/apps/arvana/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: arvana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

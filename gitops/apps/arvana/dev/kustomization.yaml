apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arvana
resources:
  - namespace.yaml
  - secrets.yaml
  - migration.yaml
  - api.yaml
  - frontend.yaml
  - autoscaling.yaml
images:
  - name: arvana-wear-api
    newName: arvana-wear-api
    newTag: dev
  - name: arvana-wear-frontend
    newName: arvana-wear-frontend
    newTag: dev

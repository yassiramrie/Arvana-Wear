apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: arvana-aws-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arvana-app
  namespace: arvana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: arvana-aws-secrets
  target:
    name: arvana-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: arvana/dev/application
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arvana-db-admin
  namespace: arvana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: arvana-aws-secrets
  target:
    name: arvana-db-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: arvana/dev/database-admin

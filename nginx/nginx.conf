# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Reverse proxy untuk Arvana Wear (Docker version)
# ─────────────────────────────────────────────────────────────────────────────
# Mirip konfigurasi Nginx di deploy.yml (CI/CD), tapi:
#   - proxy_pass mengarah ke 'app:3000' (Docker DNS), bukan localhost
#   - Tidak ada sistemd/service manager — dikelola oleh Docker
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files (images, css, etc)
    location /images/ {
        alias /usr/share/nginx/html/images/;
    }

    # Serve index.html untuk GET /
    location = / {
        try_files /index.html =404;
    }

    # Proxy API routes ke Node.js app (Docker service name: app)
    location ~ ^/(health|ready|api/health|register|login)(/|$) {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

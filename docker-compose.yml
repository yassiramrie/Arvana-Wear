# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Vespa Catalog Full Stack
# ─────────────────────────────────────────────────────────────────────────────
#
# Services yang berjalan:
#   1. postgres      → Database (ganti AWS RDS)         port 5432
#   2. app           → Node.js Express API               port 3000
#   3. nginx         → Reverse proxy + static files      port 8080
#   4. node-exporter → Metrics OS (CPU, RAM, disk)       port 9100
#   5. prometheus    → Metrics collector & storage       port 9090
#   6. grafana       → Dashboard visualisasi             port 3001
#
# Cara pakai:
#   cp .env.docker .env          ← siapkan env file
#   docker compose up -d         ← jalankan semua service
#   docker compose down          ← hentikan semua service
#   docker compose logs -f app   ← lihat log service tertentu
#
# Akses:
#   http://localhost:8080        ← Frontend (via Nginx)
#   http://localhost:3000        ← API langsung (opsional, untuk debugging)
#   http://localhost:3001        ← Grafana
#   http://localhost:9090        ← Prometheus
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. POSTGRESQL ────────────────────────────────────────────────────────────
  # Menggantikan AWS RDS. Data tersimpan di Docker volume (postgres_data)
  # sehingga tidak hilang saat container direstart.
  postgres:
    image: postgres:16-alpine
    container_name: vespa-postgres
    environment:
      POSTGRES_DB:       vespa_catalog
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vespa_secret}    # Di-inject dari .env / CI secrets
    volumes:
      - postgres_data:/var/lib/postgresql/data      # Persist data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Auto-run saat DB pertama kali dibuat
    ports:
      - "5432:5432"   # host:container — bisa diakses dari luar container (opsional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vespa_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. NODE.JS APP ───────────────────────────────────────────────────────────
  # Build dari Dockerfile di folder ini.
  # DB_HOST=postgres → Docker DNS otomatis resolve ke container postgres di atas.
  app:
    build: .
    container_name: vespa-app
    environment:
      NODE_ENV:    production
      PORT:        3000
      DB_HOST:     postgres       # Nama service di atas, bukan IP/RDS endpoint
      DB_PORT:     5432
      DB_NAME:     vespa_catalog
      DB_USER:     postgres
      DB_PASSWORD: ${DB_PASSWORD:-vespa_secret}   # Harus sama dengan POSTGRES_PASSWORD di atas
      DB_SSL:      "false"        # Disable SSL untuk koneksi lokal antar container
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy  # Tunggu postgres siap sebelum app start
    restart: unless-stopped

  # ── 3. NGINX ──────────────────────────────────────────────────────────────────
  # Reverse proxy yang:
  #   - Serve index.html (frontend) di http://localhost:8080
  #   - Proxy API request (/health, /register, /login) ke app:3000
  #
  # Dengan ini frontend dan backend satu origin → tidak ada CORS issue.
  # Cocok dengan arsitektur production di deploy.yml.
  nginx:
    image: nginx:alpine
    container_name: vespa-nginx
    ports:
      - "8080:80"             # host:container — akses via http://localhost:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Config
      - ./index.html:/usr/share/nginx/html/index.html:ro       # Frontend
    depends_on:
      - app
    restart: unless-stopped

  # ── 4. NODE EXPORTER ─────────────────────────────────────────────────────────
  # Mengambil metrics OS: CPU, RAM, disk, network, processes.
  # Mount /proc, /sys, / dari host agar bisa baca metrics real host.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: vespa-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "9100:9100"
    restart: unless-stopped

  # ── 5. PROMETHEUS ────────────────────────────────────────────────────────────
  # Scrape metrics dari node-exporter dan dirinya sendiri.
  # Config di-mount dari ./monitoring/prometheus.yml.
  prometheus:
    image: prom/prometheus:latest
    container_name: vespa-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'    # Simpan data 7 hari
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
    restart: unless-stopped

  # ── 6. GRAFANA ────────────────────────────────────────────────────────────────
  # Dashboard visualisasi. Akses di http://localhost:3001
  # Default login: admin / admin123
  # Datasource Prometheus sudah auto-provisioning dari file datasources.yml.
  grafana:
    image: grafana/grafana:latest
    container_name: vespa-grafana
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin123}    # Di-inject dari .env / CI secrets
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"   # Grafana internal port 3000 → expose ke host port 3001
    depends_on:
      - prometheus
    restart: unless-stopped

# ── VOLUMES ───────────────────────────────────────────────────────────────────
# Named volumes dikelola Docker. Data tetap ada walau container di-restart.
# Untuk hapus semua data: docker compose down -v
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

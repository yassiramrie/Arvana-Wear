# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Arvana Wear Full Stack (IMPROVED)
# ─────────────────────────────────────────────────────────────────────────────
#
# ✅ Perbaikan dari review:
# 1. Port expose dibatasi — app gak perlu di-expose ke host
# 2. Default password dihapus dari komentar → wajib .env
# 3. Tag "latest" diganti versi spesifik
# 4. Network explicit untuk segmentasi
# 5. Resource limits ditambahkan
# 6. Security hardening: non-root users, read-only rootfs, no-new-privileges
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. POSTGRESQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.3-alpine                       # ✅ Pin versi spesifik
    container_name: arvana-postgres
    environment:
      POSTGRES_DB: arvana_wear
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?WAJIB isi DB_PASSWORD di .env}  # ✅ Fail kalo kosong
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"                         # ✅ Binding ke localhost aja
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arvana_wear"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - arvana-internal                                # ✅ Network internal aja
    security_opt:
      - no-new-privileges:true                         # 🔒 Cegah privilege escalation
    deploy:
      resources:
        limits:
          memory: 512M                                 # ✅ Limit memory

  # ── 2. NODE.JS APP ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arvana-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: arvana_wear
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?WAJIB isi DB_PASSWORD di .env}
      DB_SSL: "false"
    expose:
      - "3000"                                         # ✅ Cuma visible di internal network
    # ports: HAPUS — gak perlu, akses via nginx aja
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - arvana-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL                                            # 🔒 Drop semua kapabilitas Linux
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── 3. NGINX ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine                           # ✅ Pin versi spesifik
    container_name: arvana-nginx
    ports:
      - "8888:80"                                      # ✅ Port disesuaikan dengan config Security Group & deploy.yml
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./images:/usr/share/nginx/html/images:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - arvana-frontend                                 # ✅ Network terpisah buat public
      - arvana-internal                                 # ✅ Bisa akses internal (ke app)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── 4. NODE EXPORTER ─────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2                   # ✅ Pin versi spesifik
    container_name: arvana-node-exporter
    pid: "host"                                        # ✅ Perlu akses ke namespace PID Host untuk metrik akurat
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:9100:9100"                          # ✅ Binding localhost aja
    restart: unless-stopped
    networks:
      - arvana-monitoring                               # ✅ Network monitoring terpisah
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M

  # ── 5. PROMETHEUS ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1                      # ✅ Pin versi spesifik
    container_name: arvana-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.listen-address=:9090'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'                        # reload config via API tanpa restart
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"                          # ✅ Binding localhost
    depends_on:
      - node-exporter
    restart: unless-stopped
    networks:
      - arvana-monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── 6. GRAFANA ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2                       # ✅ Udah pin versi 👍
    container_name: arvana-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}           # ✅ Bisa ganti user
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?WAJIB isi GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
      GF_AUTH_ANONYMOUS_ENABLED: "false"                      # 🔒 Matiin guest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"                      # ✅ Binding localhost
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - arvana-monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

# ── VOLUMES ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: arvana_postgres_data                          # ✅ Nama explicit biar gampang di-track
  prometheus_data:
    name: arvana_prometheus_data
  grafana_data:
    name: arvana_grafana_data

# ── NETWORKS ───────────────────────────────────────────────────────────────────
# ✅ Segregation: public, internal, monitoring — gak bisa saling akses sembarangan
networks:
  arvana-frontend:       # Public-facing: cuma nginx
    driver: bridge
    name: arvana_frontend

  arvana-internal:       # Internal: app + postgres + nginx (buat reverse proxy)
    driver: bridge
    internal: true       # ⚠️ CATATAN: Hapus/comment baris ini jika App perlu akses API dari internet (misal payment gateway/email)
    name: arvana_internal

  arvana-monitoring:     # Monitoring: prometheus, grafana, node-exporter
    driver: bridge
    name: arvana_monitoring

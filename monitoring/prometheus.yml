# ─────────────────────────────────────────────────────────────────────────────
# prometheus.yml — Konfigurasi Prometheus
# ─────────────────────────────────────────────────────────────────────────────
# Mode Docker:
#   Target menggunakan nama service Docker (bukan 127.0.0.1).
#   Docker DNS otomatis resolve nama service → IP container yang benar.
#
#   prometheus    → http://prometheus:9090/metrics
#   node-exporter → http://node-exporter:9100/metrics
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor:     'vespa-catalog'
    environment: 'docker'

scrape_configs:

  # 1. Prometheus memantau dirinya sendiri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # 2. Node Exporter — metrics OS: CPU, RAM, disk, network
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'vespa-server'
